stages:
  - validate

kernel:validate:
  stage: validate
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  rules:
    - when: always
  script:
    - python --version
    - uv --version
    - uvx --version
    - uvx -n --from ./tools/rocs-cli rocs validate --repo . --strict-placeholders
    - uvx -n --from ./tools/rocs-cli rocs build --repo .
  artifacts:
    when: always
    paths:
      - ontology/dist/
