stages:
  - validate

kernel:validate:
  stage: validate
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  tags:
    - runner::mr
  rules:
    - when: always
  script:
    - python --version
    - uv --version
    - uvx --version
    - chmod +x ./scripts/ci/full.sh
    - env -u ROCS_REPO -u ROCS_WORKSPACE_ROOT -u ROCS_WORKSPACE_REF_MODE ROCS_CI_PROFILE=main-strict ./scripts/ci/full.sh
  artifacts:
    when: always
    paths:
      - ontology/dist/
