stages:
  - validate

kernel:validate:
  stage: validate
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  rules:
    - when: always
  script:
    - python --version
    - uv --version
    - uv venv .venv
    - uv pip install -p .venv/bin/python -n ./tools/rocs-cli
    - .venv/bin/rocs validate --repo . --strict-placeholders
    - .venv/bin/rocs build --repo .
  artifacts:
    when: always
    paths:
      - ontology/dist/
